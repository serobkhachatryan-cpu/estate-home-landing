<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oriel card · Aldworth historical playback</title>
    <script type="module" src="./oriel-card.js"></script>
    <script src="/oriel-private/aldworth-history.js?v=2"></script>
    <style>body { margin: 0; background: #e7e1d7; } .notice { position: fixed; right: 16px; bottom: 16px; z-index: 2; max-width: 380px; padding: 12px; border: 1px solid #c7b79e; border-radius: 14px; background: #fffaf0; color: #243f51; font: 13px/1.4 system-ui,sans-serif; box-shadow: 0 10px 28px rgba(28,42,46,.18); }</style>
  </head>
  <body>
    <oriel-card id="card"></oriel-card>
    <aside class="notice"><strong>Private local playback.</strong><br />It uses only locally validated Aldworth Recorder history. The source dropdown distinguishes reconciled House Input feeders from independent meters; each partial week shows its recorded-day coverage. Nothing is sent anywhere.</aside>
    <script type="module">
      const fixture = window.__orielAldworthHistoryFixture;
      if (!fixture) throw new Error('Run npm run build:oriel-historical-fixture before opening this private playback page.');
      if (!fixture.archive?.electricity || !fixture.archive?.water || !fixture.breakdowns) throw new Error('Rebuild the private fixture to include validated weekly source breakdowns.');
      const card = document.querySelector('#card');
      const entity = (entity_id, source) => ({ entity_id, state: source.state, attributes: { friendly_name: source.label, unit_of_measurement: source.unit, device_class: source.deviceClass }, last_changed: fixture.anchor, last_updated: fixture.anchor });
      const electricity = 'sensor.shellypro3em_9454c5b9da04_energy';
      const water = 'sensor.house_water_1_total_l';
      const states = Object.fromEntries(Object.entries(fixture.sources).map(([id, source]) => [id, entity(id, source)]));
      const weeklySource = (entity_id, label, relation, utility) => ({
        entity_id,
        label,
        relation,
        archive_weekly_values: fixture.breakdowns[entity_id].values,
        archive_weekly_recorded_days: fixture.breakdowns[entity_id].recordedDays,
        archive_week_starts: fixture.archive[utility].weekStarts,
      });
      card.setConfig({
        type: 'custom:oriel-card',
        entity_ids: { electricity: [electricity], water: [water], fuel: [], power: [] },
        archive_anchor: fixture.anchor,
        archive_timezone: 'Europe/London',
        archive_weekly_values: {
          electricity: fixture.archive.electricity.values,
          water: fixture.archive.water.values,
        },
        archive_week_starts: {
          electricity: fixture.archive.electricity.weekStarts,
          water: fixture.archive.water.weekStarts,
        },
        archive_weekly_recorded_days: {
          electricity: fixture.archive.electricity.recordedDays,
          water: fixture.archive.water.recordedDays,
        },
        source_breakdowns: {
          electricity: {
            open: true,
            title: 'Where electricity was metered',
            note: 'House, Pool and Garage reconcile to House Input. Greenhouse, Garden Garage, Lodge and Office are independent metered feeders and are not added to House Input. Each row retains only its locally validated days.',
            sources: [
              weeklySource('sensor.shellypro3em_9454c5b9da04_phase_a_energy', 'House', 'part_of_total', 'electricity'),
              weeklySource('sensor.shellypro3em_9454c5b9da04_phase_b_energy', 'Pool', 'part_of_total', 'electricity'),
              weeklySource('sensor.shellypro3em_9454c5b9da04_phase_c_energy', 'Garage', 'part_of_total', 'electricity'),
              weeklySource('sensor.shellypro3em_3c8a1fd24550_phase_b_energy', 'Greenhouse', 'independent', 'electricity'),
              weeklySource('sensor.shellypro3em_3c8a1fd24550_phase_c_energy', 'Garden Garage', 'independent', 'electricity'),
              weeklySource('sensor.shellypro3em_3c8a1fd2544c_phase_a_energy', 'Lodge', 'independent', 'electricity'),
              weeklySource('sensor.shellypro3em_3c8a1fd2544c_phase_c_energy', 'Office', 'independent', 'electricity'),
            ],
          },
          water: {
            open: true,
            title: 'Independent water meters',
            note: 'Lodge Water and Main Water are separate measured meters. Their plumbing topology is not approved, so they are not added to House Water. Partial weeks show the source-specific validated coverage.',
            sources: [
              weeklySource('sensor.lodge_water_total_l', 'Lodge Water', 'independent', 'water'),
              weeklySource('sensor.main_water_total_l', 'Main Water', 'independent', 'water'),
            ],
          },
        },
      });
      card.hass = { states };
    </script>
  </body>
</html>
